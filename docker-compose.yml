version: '3.8'

services:
  monica-proxy:
    # Der Name des Containers, um ihn leichter zu verwalten.
    container_name: monica-proxy
    
    # Baut das Image aus dem Dockerfile im aktuellen Verzeichnis.
    build:
      context: .
      dockerfile: Dockerfile
      
    # Startet den Container automatisch neu, es sei denn, er wird manuell gestoppt.
    restart: unless-stopped
    
    # Der Befehl, der beim Starten des Containers ausgeführt wird.
    command: ["python", "monica_proxy.py", "--port", "5001"]
    # Für die Fehlersuche können Sie diesen Befehl verwenden:
    # command: ["python", "monica_proxy.py", "--port", "5001", "--debug"]
    
        # Veröffentlicht die Ports des Containers auf dem Host-System
    ports:
      - "5001:5001"  # Monica.im API
      - "5002:5001"  # OpenAI API (intern auf 5001 gemappt)
      - "5003:5001"  # Google API (intern auf 5001 gemappt)

    # Mappt die lokale `models.json` in den Container.
    # Dies stellt sicher, dass Ihre Model-Liste von außen verwaltet werden kann.
    volumes:
      # <Pfad auf dem Host>:<Pfad im Container>:<Zugriffsmodus>
      - ./models.json:/app/models.json:ro
    
    # Resource Limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    
  # Restart policy is set above
    
    # Health check um Container-Status zu überwachen
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# In dieser Konfiguration sind keine externen Netzwerke wie das von Traefik erforderlich.

